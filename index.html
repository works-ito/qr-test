<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<title>QR連続読取</title>

<style>
body { font-family:sans-serif; font-size:22px; padding:20px; }
button, select, input {
  font-size:24px; padding:14px; width:100%;
  margin-bottom:12px; box-sizing:border-box;
}
#status { color:blue; font-weight:bold; white-space:pre-wrap; margin:10px 0; }
#lastRead {
  color:green; font-size:34px; font-weight:bold;
  margin:10px 0; min-height:80px; white-space:pre-line;
}
#video {
  width:100%;
  max-width:320px;
  aspect-ratio: 1 / 1;
  object-fit: cover;
}
#count { font-size:28px; font-weight:bold; margin:14px 0 8px; }
#scanList { font-size:28px; line-height:1.5; margin-top:8px; white-space:pre-wrap; }
.readItem { margin-bottom:4px; }
canvas { display:none; }
</style>
</head>

<body>
<h2>QR連続読取</h2>

<select id="mode" onchange="toggleRecTarget()">
  <option value="出庫">出庫</option>
  <option value="返却">返却</option>
  <option value="修理">修理</option>
  <option value="完成機">完成機</option>
  <option value="拠点移動">拠点移動</option>
  <option value="校正中">校正中</option>
  <option value="校正完了">校正完了</option>
  <option value="交換完了">交換完了</option>
</select>

<div id="recTargetBox" style="display:none;">
  <select id="recTarget">
    <option value="本体">本体</option>
    <option value="騒音計">騒音計</option>
    <option value="振動計">振動計</option>
    <option value="内部USB">内部USB</option>
  </select>
</div>

<select id="location">
  <option value="本社">本社</option>
  <option value="三郷">三郷</option>
  <option value="メインファクトリー">メインファクトリー</option>
</select>

<select id="user">
  <option value="" selected>担当者選択</option>
  <option value="奥">奥</option>
  <option value="滝島">滝島</option>
  <option value="上野">上野</option>
  <option value="見﨑">見﨑</option>
  <option value="田之岡">田之岡</option>
  <option value="篠塚">篠塚</option>
  <option value="その他">その他</option>
</select>

<button id="startBtn" onclick="startQr()">カメラ起動</button>
<button id="stopBtn" onclick="stopQr()" style="display:none;">停止</button>
<button id="resetBtn" onclick="resetScan()" style="display:none;">読取リセット</button>

<div id="status">未クリック</div>
<div id="lastRead"></div>

<video id="video" playsinline></video>
<canvas id="canvas"></canvas>

<div id="count">読取件数：0件</div>
<div id="scanList"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyx4OYpiyIgKOxLqBFkJIiTaJ0wSF6Hrp12Krkd7MNL996uySBdA6o-d2F4dkT95Be1Vw/exec";

let stream = null;
let scanning = false;
let scannedSet = new Set();

function log(msg) {
  document.getElementById("status").innerText = msg;
}

function toggleRecTarget() {
  const mode = document.getElementById("mode").value;
  const recModes = ["校正中", "校正完了", "交換完了"];
  document.getElementById("recTargetBox").style.display =
    recModes.includes(mode) ? "block" : "none";
}

function playBeep(type) {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.frequency.value = type === "success" ? 1600 : 220;
    gain.gain.value = 0.8;

    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) {
    console.log(e);
  }
}

async function startQr() {
  log("カメラ起動中...");

  if (scanning) {
    log("すでに起動中");
    return;
  }

  try {
    const video = document.getElementById("video");

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;
    video.setAttribute("playsinline", true);
    await video.play();

    scanning = true;

    document.getElementById("startBtn").style.display = "none";
    document.getElementById("stopBtn").style.display = "block";
    document.getElementById("resetBtn").style.display = "block";

    log("カメラ起動成功");

    scanLoop();

  } catch(err) {
    log("カメラ起動失敗\n" + err);
    scanning = false;
  }
}

function scanLoop() {
  if (!scanning) return;

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, {
      inversionAttempts: "attemptBoth"
    });

    if (code && code.data) {
      handleDecoded(code.data);
    }
  }

  requestAnimationFrame(scanLoop);
}

function handleDecoded(decodedText) {
  if (scannedSet.has(decodedText)) return;

  scannedSet.add(decodedText);

  document.getElementById("lastRead").innerText =
    "読取成功\n✔ " + decodedText;

  document.getElementById("count").innerText =
    "読取件数：" + scannedSet.size + "件";

  document.getElementById("scanList").innerHTML =
    Array.from(scannedSet).reverse().map(function(item) {
      return '<div class="readItem">' + item + '</div>';
    }).join("");

  sendToSheet(decodedText);
}

function stopQr() {
  if (!scanning) {
    log("まだ起動していません");
    return;
  }

  scanning = false;

  const video = document.getElementById("video");
  video.pause();
  video.srcObject = null;

  if (stream) {
    stream.getTracks().forEach(function(track) {
      track.stop();
    });
    stream = null;
  }

  log("停止しました");

  document.getElementById("startBtn").style.display = "block";
  document.getElementById("stopBtn").style.display = "none";
  document.getElementById("resetBtn").style.display = "none";
}

function resetScan() {
  scannedSet.clear();

  document.getElementById("count").innerText = "読取件数：0件";
  document.getElementById("scanList").innerHTML = "";
  document.getElementById("lastRead").innerText = "";

  log("読取履歴をリセットしました");
}

function sendToSheet(qrText) {
  const data = {
    mode: document.getElementById("mode").value,
    qr: qrText,
    user: document.getElementById("user").value,
    location: document.getElementById("location").value,
    recTarget: document.getElementById("recTarget").value
  };

  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(data)
  });

  playBeep("success");

  if (navigator.vibrate) {
    navigator.vibrate(100);
  }

  log("読取成功");
}

toggleRecTarget();
</script>
</body>
</html>
