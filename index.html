<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<title>QR連続読取</title>

<style>
body { font-family:sans-serif; font-size:22px; padding:20px; }
button, select, input {
  font-size:24px; padding:14px; width:100%;
  margin-bottom:12px; box-sizing:border-box;
}
#reader { width:100%; max-width:420px; margin-top:15px; }
#status { color:blue; font-weight:bold; white-space:pre-wrap; }
</style>
</head>

<body>
<h2>QR連続読取</h2>

  <select id="mode" onchange="toggleRecTarget()">
  <option value="出庫">出庫</option>
  <option value="返却">返却</option>
  <option value="修理">修理</option>
  <option value="完成機">完成機</option>
  <option value="拠点移動">拠点移動</option>
  <option value="校正中">校正中</option>
  <option value="校正完了">校正完了</option>
  <option value="交換完了">交換完了</option>
</select>

<div id="recTargetBox" style="display:none;">
  <select id="recTarget">
    <option value="本体">本体</option>
    <option value="騒音計">騒音計</option>
    <option value="振動計">振動計</option>
    <option value="内部USB">内部USB</option>
  </select>
</div>

<select id="location">
  <option value="本社">本社</option>
  <option value="三郷">三郷</option>
  <option value="メインファクトリー">メインファクトリー</option>
</select>

<input id="user" placeholder="担当者名">

<button onclick="startQr()">カメラ起動</button>
<button onclick="stopQr()">停止</button>
<button onclick="resetScan()">読取リセット</button>

<div id="status">未クリック</div>
<div id="reader"></div>
<div id="count" style="font-size:24px; font-weight:bold; margin:10px 0;">
  読取件数：0件
</div>

<div id="scanList"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyx4OYpiyIgKOxLqBFkJIiTaJ0wSF6Hrp12Krkd7MNL996uySBdA6o-d2F4dkT95Be1Vw/exec";

let qr = null;
let scannedSet = new Set();

function log(msg) {
  document.getElementById("status").innerText = msg;
}

function toggleRecTarget() {
  const mode = document.getElementById("mode").value;
  const recModes = ["校正中", "校正完了", "交換完了"];
  document.getElementById("recTargetBox").style.display =
    recModes.includes(mode) ? "block" : "none";
}
function playBeep(type) {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.frequency.value = (type === "success") ? 1600 : 220;
    gain.gain.value = 0.6;

    osc.start();
    osc.stop(ctx.currentTime + (type === "success" ? 0.25 : 0.25));

  } catch(e) {
    console.log(e);
  }
}
function startQr() {
  log("カメラ起動中...");

  if (qr) {
    log("すでに起動中");
    return;
  }

  qr = new Html5Qrcode("reader");

  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    function(decodedText) {
      if (scannedSet.has(decodedText)) return;

scannedSet.add(decodedText);

document.getElementById("count").innerText =
  "読取件数：" + scannedSet.size + "件";
document.getElementById("scanList").innerHTML +=
  "<div>" + decodedText + "</div>";
document.getElementById("result").innerText += decodedText + "\n";
sendToSheet(decodedText);
    },
    function(errorMessage) {}
  )
  .then(function() {
    log("カメラ起動成功");
  })
  .catch(function(err) {
    log("カメラ起動失敗\n" + err);
    qr = null;
  });
}

function stopQr() {
  if (!qr) {
    log("まだ起動していません");
    return;
  }

  qr.stop().then(function() {
    qr.clear();
    qr = null;
    log("停止しました");
  });
}

function resetScan() {
  scannedSet.clear();
  document.getElementById("result").innerText = "";
  document.getElementById("count").innerText = "読取件数：0件";
  log("読取履歴をリセットしました");
}

function sendToSheet(qrText) {
  const mode = document.getElementById("mode").value;
  const recTarget = document.getElementById("recTarget").value;

  const data = {
    mode: mode,
    qr: qrText,
    user: document.getElementById("user").value,
    location: document.getElementById("location").value,
    recTarget: recTarget
  };

  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(data)
  });

  playBeep("success");

  if (navigator.vibrate) {
  navigator.vibrate(100);
}
  
  log("送信しました\n" + qrText);
}

toggleRecTarget();
</script>
</body>
</html>
